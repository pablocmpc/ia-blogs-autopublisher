name: Publicar Artículos IA (3 turnos/día)

# 3 ejecuciones diarias — 1 artículo por web = 9 artículos/run (dentro del límite de Groq)
on:
  schedule:
    - cron: '0 7 * * *'   # 09:00 España
    - cron: '0 13 * * *'  # 15:00 España
    - cron: '0 19 * * *'  # 21:00 España
  workflow_dispatch:       # Permite ejecutar manualmente desde GitHub

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Crear config.json desde secrets
        working-directory: auto-publisher
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: echo "$CONFIG_JSON" > config.json

      - name: Publicar 1 artículo por web (3 total)
        working-directory: auto-publisher
        run: python publisher.py 1

      - name: Guardar keywords actualizadas en el repo
        if: always()
        run: |
          git config user.name "Auto-Publisher Bot"
          git config user.email "bot@autopublisher.ia"
          git add auto-publisher/keywords.json || true
          git diff --cached --quiet || git commit -m "bot: actualizar keywords usadas [skip ci]"
          git push || true

      - name: Subir log de publicaciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publicaciones-log-${{ github.run_id }}
          path: auto-publisher/publicaciones.csv
          retention-days: 30
